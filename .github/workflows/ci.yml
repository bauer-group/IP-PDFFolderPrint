# =============================================================================
# CI Workflow – Lint & Tests
# =============================================================================
# Runs on every push and pull request:
#   - ruff (lint) on the pinned dev version
#   - pytest (unit tests) on the supported Python versions
# =============================================================================

name: 🧪 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: 🔍 Lint (ruff)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: 📦 Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 🔍 Ruff check
        run: python -m ruff check src tests build.py

  test:
    name: 🧪 Tests (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.14']
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7

      - name: 🐍 Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 🧪 Run pytest
        run: python -m pytest
